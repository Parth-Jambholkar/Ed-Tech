<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdTech Learning Academy - Interactive Learning & Notes</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 custom-scrollbar">
  <div id="root"></div>

  <!-- Main React App Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const API_BASE = '/api';

    // Helper for authenticated fetch
    const apiFetch = async (endpoint, options = {}) => {
      const token = localStorage.getItem('edtech_token');
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...(options.headers || {})
      };
      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || data.detail || JSON.stringify(data) || 'Request failed');
      }
      return data;
    };

    function App() {
      // User & Auth State
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('edtech_token') || '');
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login', 'register', 'otp'
      const [authForm, setAuthForm] = useState({ username: '', email: '', password: '', phone_number: '', otp_code: '' });
      const [authError, setAuthError] = useState('');

      // Navigation & Views
      const [currentView, setCurrentView] = useState('catalogue'); // 'catalogue', 'library', 'orders', 'admin'
      const [searchQuery, setSearchQuery] = useState('');

      // Catalogue & Products State
      const [boards, setBoards] = useState([]);
      const [selectedBoard, setSelectedBoard] = useState(null);
      const [selectedClass, setSelectedClass] = useState(null);
      const [selectedSubject, setSelectedSubject] = useState(null);
      const [products, setProducts] = useState([]);
      const [loadingCatalogue, setLoadingCatalogue] = useState(true);

      // Cart & Checkout State
      const [cart, setCart] = useState([]);
      const [cartDrawerOpen, setCartDrawerOpen] = useState(false);
      const [couponCode, setCouponCode] = useState('');
      const [cartCalculation, setCartCalculation] = useState(null);
      const [cartLoading, setCartLoading] = useState(false);

      // Study Reader Modal State
      const [readerModal, setReaderModal] = useState({ open: false, material: null, loading: false, error: null });

      // Razorpay Payment Simulation Modal State
      const [paymentModal, setPaymentModal] = useState({ open: false, order: null, rzpOrder: null });

      // Library & Orders State
      const [libraryData, setLibraryData] = useState({ chapters: [], subjects: [], class_passes: [], free_sample_chapters: [] });
      const [orders, setOrders] = useState([]);

      // Admin State
      const [adminTab, setAdminTab] = useState('dashboard'); // 'dashboard', 'catalogue', 'products', 'coupons', 'orders', 'access'
      const [adminDashboard, setAdminDashboard] = useState(null);
      const [adminOrders, setAdminOrders] = useState([]);
      const [adminCoupons, setAdminCoupons] = useState([]);
      const [adminLogs, setAdminLogs] = useState([]);
      const [manualAccessForm, setManualAccessForm] = useState({ student_id: '', action: 'GRANT', entitlement_type: 'CHAPTER', target_id: '', duration_days: '30', reason: '' });

      // Notifications / Alerts
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial current user
      useEffect(() => {
        if (token) {
          apiFetch('/auth/me/')
            .then(u => setUser(u))
            .catch(() => {
              setToken('');
              localStorage.removeItem('edtech_token');
              setUser(null);
            });
        }
      }, [token]);

      // Load Catalogue & Products
      const loadCatalogue = async () => {
        setLoadingCatalogue(true);
        try {
          const [hierarchyData, productsData] = await Promise.all([
            apiFetch('/catalogue/hierarchy/'),
            apiFetch('/products/')
          ]);
          setBoards(hierarchyData);
          setProducts(productsData);
          if (hierarchyData.length > 0) {
            const defaultBoard = hierarchyData[0];
            setSelectedBoard(defaultBoard);
            if (defaultBoard.classes && defaultBoard.classes.length > 0) {
              const defaultClass = defaultBoard.classes[0];
              setSelectedClass(defaultClass);
              if (defaultClass.subjects && defaultClass.subjects.length > 0) {
                setSelectedSubject(defaultClass.subjects[0]);
              }
            }
          }
        } catch (err) {
          console.error("Failed to load catalogue:", err);
        } finally {
          setLoadingCatalogue(false);
        }
      };

      useEffect(() => {
        loadCatalogue();
      }, [user]);

      // Re-calculate cart when items or coupon change
      useEffect(() => {
        if (cart.length === 0) {
          setCartCalculation(null);
          return;
        }
        if (!user) return;

        setCartLoading(true);
        apiFetch('/cart/calculate/', {
          method: 'POST',
          body: JSON.stringify({
            product_ids: cart.map(p => p.id),
            coupon_code: couponCode
          })
        })
        .then(res => setCartCalculation(res))
        .catch(err => {
          showToast(err.message, 'error');
          // If coupon was invalid, clear coupon
          if (couponCode) setCouponCode('');
        })
        .finally(() => setCartLoading(false));
      }, [cart, couponCode, user]);

      // Load Library Data
      const loadLibrary = async () => {
        if (!user) return;
        try {
          const data = await apiFetch('/library/');
          setLibraryData(data);
        } catch (err) {
          console.error("Failed to load library:", err);
        }
      };

      // Load Orders Data
      const loadOrders = async () => {
        if (!user) return;
        try {
          const data = await apiFetch('/orders/');
          setOrders(data);
        } catch (err) {
          console.error("Failed to load orders:", err);
        }
      };

      // Load Admin Data
      const loadAdminData = async () => {
        if (!user || !user.is_admin) return;
        try {
          if (adminTab === 'dashboard') {
            const dash = await apiFetch('/admin/dashboard/');
            setAdminDashboard(dash);
          } else if (adminTab === 'orders') {
            const ords = await apiFetch('/admin/orders/');
            setAdminOrders(ords);
          } else if (adminTab === 'coupons') {
            const coups = await apiFetch('/admin/coupons/');
            setAdminCoupons(coups);
          } else if (adminTab === 'access') {
            const logs = await apiFetch('/admin/access/logs/');
            setAdminLogs(logs);
          }
        } catch (err) {
          console.error("Admin data error:", err);
        }
      };

      useEffect(() => {
        if (currentView === 'library') loadLibrary();
        if (currentView === 'orders') loadOrders();
        if (currentView === 'admin') loadAdminData();
      }, [currentView, adminTab, user]);

      // Re-initialize Lucide icons on render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Quick Demo Switcher helper
      const loginDemoAccount = async (role) => {
        const username = role === 'admin' ? 'admin' : 'student';
        const password = role === 'admin' ? 'Admin@123' : 'Student@123';
        try {
          const res = await apiFetch('/auth/login/', {
            method: 'POST',
            body: JSON.stringify({ username_or_email: username, password })
          });
          localStorage.setItem('edtech_token', res.token);
          setToken(res.token);
          setUser(res.user);
          showToast(`Logged in as ${role === 'admin' ? 'Admin (System)' : 'Student (Rahul)'}`);
          setAuthModalOpen(false);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Cart Actions
      const addToCart = (product) => {
        if (!user) {
          setAuthModalOpen(true);
          return;
        }
        if (cart.find(item => item.id === product.id)) {
          showToast("Item is already in your cart.", "info");
          setCartDrawerOpen(true);
          return;
        }
        setCart([...cart, product]);
        showToast(`Added ${product.title} to cart`);
        setCartDrawerOpen(true);
      };

      const removeFromCart = (productId) => {
        setCart(cart.filter(item => item.id !== productId));
      };

      // Study Notes Reader
      const openReader = async (materialId, chapterTitle) => {
        if (!user) {
          setAuthModalOpen(true);
          return;
        }
        setReaderModal({ open: true, material: null, loading: true, error: null, chapterTitle });
        try {
          const data = await apiFetch(`/materials/${materialId}/content/`);
          setReaderModal({ open: true, material: data, loading: false, error: null, chapterTitle });
        } catch (err) {
          setReaderModal({
            open: true,
            material: null,
            loading: false,
            error: err.message || "Access Denied (HTTP 403 Forbidden). Product must be purchased to read locked notes.",
            chapterTitle
          });
        }
      };

      // Checkout Initiation
      const handleCheckout = async () => {
        if (cart.length === 0) return;
        setCartLoading(true);
        try {
          const res = await apiFetch('/orders/create/', {
            method: 'POST',
            body: JSON.stringify({
              product_ids: cart.map(p => p.id),
              coupon_code: couponCode
            })
          });

          // If free order (100% discount or ₹0)
          if (res.is_free) {
            showToast("Order completed for ₹0! Access granted.", "success");
            setCart([]);
            setCartCalculation(null);
            setCartDrawerOpen(false);
            loadCatalogue();
            setCurrentView('library');
            return;
          }

          // Open Payment Modal (Handles both official Razorpay Checkout and Test Mode Simulator)
          setPaymentModal({
            open: true,
            order: res.order,
            rzpOrder: res
          });
          setCartDrawerOpen(false);
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setCartLoading(false);
        }
      };

      // Simulate or verify payment
      const handleSimulatePayment = async (statusType, upiId) => {
        if (!paymentModal.order) return;
        try {
          const res = await apiFetch(`/orders/${paymentModal.order.id}/simulate-test-payment/`, {
            method: 'POST',
            body: JSON.stringify({
              status: statusType,
              upi_id: upiId
            })
          });

          if (statusType === 'FAILURE') {
            showToast("Payment failed as simulated by failure@razorpay.", "error");
            setPaymentModal({ ...paymentModal, open: false });
            return;
          }

          if (statusType === 'PENDING') {
            showToast("UPI Collect request is pending. Waiting for student approval...", "info");
            return;
          }

          showToast("Payment Verified Successfully! Access granted to your library.", "success");
          setPaymentModal({ open: false, order: null, rzpOrder: null });
          setCart([]);
          setCartCalculation(null);
          loadCatalogue();
          setCurrentView('library');
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Official Razorpay Checkout integration
      const openOfficialRazorpayCheckout = () => {
        const { rzpOrder } = paymentModal;
        if (!window.Razorpay || !rzpOrder) return;

        const options = {
          key: rzpOrder.razorpay_key_id,
          amount: rzpOrder.amount_paise,
          currency: rzpOrder.currency || "INR",
          name: "EdTech Academy",
          description: `Order #${rzpOrder.order.order_number}`,
          order_id: rzpOrder.razorpay_order_id,
          handler: async function (response) {
            try {
              const verifyRes = await apiFetch('/orders/verify/', {
                method: 'POST',
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature,
                  payment_method: 'UPI'
                })
              });
              showToast("Payment verified via Razorpay! Access unlocked.", "success");
              setPaymentModal({ open: false, order: null, rzpOrder: null });
              setCart([]);
              setCartCalculation(null);
              loadCatalogue();
              setCurrentView('library');
            } catch (err) {
              showToast(err.message, 'error');
            }
          },
          prefill: {
            name: user ? user.username : "",
            email: user ? user.email : "",
            contact: user ? user.phone_number : ""
          },
          theme: { color: "#2563eb" }
        };

        const rzp = new window.Razorpay(options);
        rzp.on('payment.failed', function (response) {
          showToast(`Payment Failed: ${response.error.description}`, "error");
        });
        rzp.open();
      };

      // Filtered Chapters for Catalogue view
      const activeChapters = useMemo(() => {
        if (!selectedSubject || !selectedSubject.chapters) return [];
        if (!searchQuery) return selectedSubject.chapters;
        return selectedSubject.chapters.filter(ch =>
          ch.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (ch.description && ch.description.toLowerCase().includes(searchQuery.toLowerCase()))
        );
      }, [selectedSubject, searchQuery]);

      // Find products related to current scope
      const subjectProduct = useMemo(() => {
        if (!selectedSubject) return null;
        return products.find(p => p.product_type === 'SUBJECT' && p.target_subject === selectedSubject.id);
      }, [selectedSubject, products]);

      const classPasses = useMemo(() => {
        if (!selectedClass) return [];
        return products.filter(p => ['MONTHLY_PASS', 'ANNUAL_PASS'].includes(p.product_type) && p.target_class === selectedClass.id);
      }, [selectedClass, products]);

      return (
        <div class="flex flex-col min-h-screen">
          {/* Top Quick Demo Switcher Bar */}
          <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white text-xs py-2 px-4 border-b border-indigo-800 flex flex-wrap items-center justify-between gap-2 shadow-inner">
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500 text-slate-950">Assessment Demo Mode</span>
              <span class="text-slate-300 hidden md:inline">Test Razorpay, UPI simulation, Upgrade Credits, and Access Locks</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-slate-400">Quick Login:</span>
              <button onClick={() => loginDemoAccount('student')} class="px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 font-semibold transition">
                Student (Rahul)
              </button>
              <button onClick={() => loginDemoAccount('admin')} class="px-2.5 py-1 rounded bg-slate-700 hover:bg-slate-600 font-semibold transition">
                Admin (System)
              </button>
              {user && (
                <button onClick={() => { localStorage.removeItem('edtech_token'); setToken(''); setUser(null); showToast("Logged out"); }} class="text-rose-400 hover:text-rose-300 ml-2">
                  Logout
                </button>
              )}
            </div>
          </div>

          {/* Main Navigation Bar */}
          <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div class="flex items-center gap-6">
                <div onClick={() => setCurrentView('catalogue')} class="flex items-center gap-2 cursor-pointer group">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20 group-hover:scale-105 transition">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">EdTech</span>
                    <span class="text-xs block text-slate-500 font-semibold uppercase tracking-wider">Academy</span>
                  </div>
                </div>

                <nav class="hidden md:flex items-center space-x-1">
                  <button onClick={() => setCurrentView('catalogue')} class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'catalogue' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'}`}>
                    Catalogue
                  </button>
                  <button onClick={() => { if (!user) setAuthModalOpen(true); else setCurrentView('library'); }} class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'library' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'}`}>
                    My Library
                  </button>
                  <button onClick={() => { if (!user) setAuthModalOpen(true); else setCurrentView('orders'); }} class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'orders' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'}`}>
                    Orders & Invoices
                  </button>
                  {user && user.is_admin && (
                    <button onClick={() => setCurrentView('admin')} class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentView === 'admin' ? 'bg-purple-50 text-purple-600 font-bold' : 'text-purple-600 hover:bg-purple-50'}`}>
                      Admin Portal
                    </button>
                  )}
                </nav>
              </div>

              {/* Search Bar */}
              <div class="flex-1 max-w-md hidden lg:block">
                <div class="relative">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                  <input
                    type="text"
                    placeholder="Search chapters, topics, formulas..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    class="w-full pl-9 pr-4 py-2 rounded-full border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600">✕</button>
                  )}
                </div>
              </div>

              {/* Cart & Profile Area */}
              <div class="flex items-center gap-3">
                <button
                  onClick={() => setCartDrawerOpen(true)}
                  class="relative p-2.5 rounded-full hover:bg-slate-100 text-slate-700 transition"
                  title="View Cart"
                >
                  <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                  {cart.length > 0 && (
                    <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center animate-pulse">
                      {cart.length}
                    </span>
                  )}
                </button>

                {user ? (
                  <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 text-white font-bold text-xs flex items-center justify-center">
                      {user.username.slice(0, 2).toUpperCase()}
                    </div>
                    <div class="hidden sm:block text-left">
                      <div class="text-xs font-bold text-slate-900 leading-tight">{user.username}</div>
                      <div class="text-[10px] font-semibold text-slate-500 uppercase">{user.role}</div>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    class="px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold shadow-md shadow-blue-500/20 transition"
                  >
                    Sign In
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Toast Notification Alert */}
          {toast && (
            <div class={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-xl border flex items-center gap-3 text-sm font-medium transition-all transform animate-bounce ${
              toast.type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200' :
              toast.type === 'info' ? 'bg-sky-50 text-sky-800 border-sky-200' :
              'bg-emerald-50 text-emerald-800 border-emerald-200'
            }`}>
              <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} class="w-5 h-5"></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* MAIN VIEW CONTENT */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {currentView === 'catalogue' && (
              <div>
                {/* Hero Banner with Class Pass CTA */}
                <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white p-8 mb-8 shadow-xl">
                  <div class="relative z-10 max-w-2xl">
                    <span class="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-sm text-xs font-bold tracking-wide uppercase mb-3">
                      Comprehensive CBSE Board Curriculum
                    </span>
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight mb-3">
                      Master Your Subjects with Curated Notes & Passes
                    </h1>
                    <p class="text-blue-100 text-sm sm:text-base mb-6">
                      Buy individual chapters for ₹49, get full subject packs for ₹499 with lifetime upgrades, or unlock the entire class with an all-access pass!
                    </p>
                    <div class="flex flex-wrap gap-3">
                      {classPasses.map(cp => (
                        <button
                          key={cp.id}
                          disabled={cp.is_owned}
                          onClick={() => addToCart(cp)}
                          class={`px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center gap-2 transition shadow-md ${
                            cp.is_owned
                              ? 'bg-emerald-500 text-white cursor-default'
                              : 'bg-white text-blue-700 hover:bg-blue-50'
                          }`}
                        >
                          <i data-lucide={cp.is_owned ? 'check' : 'zap'} class="w-4 h-4"></i>
                          {cp.is_owned ? `${cp.title} (Owned)` : `${cp.title} - ₹${cp.price_rupees}`}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Hierarchy Selector: Board -> Class -> Subject */}
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mb-8">
                  <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-100">
                    {/* Class Selector Tabs */}
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Grade:</span>
                      {selectedBoard && selectedBoard.classes && selectedBoard.classes.map(cl => (
                        <button
                          key={cl.id}
                          onClick={() => { setSelectedClass(cl); if (cl.subjects && cl.subjects.length > 0) setSelectedSubject(cl.subjects[0]); }}
                          class={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                            selectedClass && selectedClass.id === cl.id
                              ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'

                            type="email"
                            value={authForm.email}
                            onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                            class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                        </div>
                      )}
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                        <input
                          type="password"
                          value={authForm.password}
                          onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                          class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <button
                        onClick={async () => {
                          setAuthError('');
                          try {
                            const endpoint = authMode === 'login' ? '/auth/login/' : '/auth/register/';
                            const payload = authMode === 'login'
                              ? { username_or_email: authForm.username, password: authForm.password }
                              : { username: authForm.username, email: authForm.email, password: authForm.password, role: 'STUDENT' };
                            const res = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(payload) });
                            localStorage.setItem('edtech_token', res.token);
                            setToken(res.token);
                            setUser(res.user);
                            setAuthModalOpen(false);
                            showToast("Welcome back!");
                          } catch (err) {
                            setAuthError(err.message);
                          }
                        }}
                        class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md transition"
                      >
                        {authMode === 'login' ? 'Sign In' : 'Sign Up'}
                      </button>
                    </>
                  ) : (
                    <>
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Phone Number</label>
                        <input
                          type="text"
                          placeholder="9876543210"
                          value={authForm.phone_number}
                          onChange={(e) => setAuthForm({ ...authForm, phone_number: e.target.value })}
                          class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">OTP Code (Use '123456' for Mock SMS)</label>
                        <input
                          type="text"
                          placeholder="123456"
                          value={authForm.otp_code}
                          onChange={(e) => setAuthForm({ ...authForm, otp_code: e.target.value })}
                          class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <button
                        onClick={async () => {
                          setAuthError('');
                          try {
                            const res = await apiFetch('/auth/otp-mock/', {
                              method: 'POST',
                              body: JSON.stringify({ phone_number: authForm.phone_number, otp_code: authForm.otp_code })
                            });
                            if (res.token) {
                              localStorage.setItem('edtech_token', res.token);
                              setToken(res.token);
                              setUser(res.user);
                              setAuthModalOpen(false);
                              showToast("Logged in via OTP!");
                            } else {
                              showToast(res.message, "info");
                            }
                          } catch (err) {
                            setAuthError(err.message);
                          }
                        }}
                        class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition"
                      >
                        Verify OTP & Log In
                      </button>
                    </>
                  )}

                  <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    {authMode === 'login' ? (
                      <>
                        <button onClick={() => setAuthMode('register')} class="text-blue-600 hover:underline">Create an account</button>
                        <button onClick={() => setAuthMode('otp')} class="text-slate-600 hover:underline">Use Mobile OTP</button>
                      </>
                    ) : (
                      <button onClick={() => setAuthMode('login')} class="text-blue-600 hover:underline">Already have an account? Sign in</button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
            <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>© 2026 EdTech Academy Pvt Ltd • GSTIN: 07AAAAA0000A1Z5 • Commercial Education & Coaching</div>
              <div class="flex items-center gap-4">
                <span>Razorpay Test Mode Verified</span>
                <span>•</span>
                <span>18% Inclusive GST Compliant</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
